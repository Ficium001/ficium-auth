name: ficium-auth Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ficium-auth /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ficium-auth-production.up.railway.app/health)
          echo "ficium-auth health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: ficium-auth returned $STATUS"
          fi

      - name: Ping portal-api /health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ficium-portal-api-production.up.railway.app/health)
          echo "portal-api health: $STATUS"
